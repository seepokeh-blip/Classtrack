<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Test</title>
  <style>
    body { font-family: sans-serif; padding: 40px; font-size: 24px; }
    button { padding: 30px 60px; font-size: 24px; background: #991B1B; color: white; border: none; border-radius: 12px; }
    #log { margin-top: 30px; font-size: 18px; color: #333; }
  </style>
</head>
<body>
  <h1>Tap Test</h1>
  <button onclick="document.getElementById('log').textContent = 'BUTTON TAPPED at ' + new Date().toLocaleTimeString()">TAP ME</button>
  <button id="btn2">TAP ME 2</button>
  <div id="log">No taps yet.</div>
  <script>
    document.getElementById('btn2').addEventListener('click', function() {
      document.getElementById('log').textContent = 'BUTTON 2 TAPPED at ' + new Date().toLocaleTimeString();
    });
    document.body.addEventListener('click', function(e) {
      console.log('Click on:', e.target.tagName, e.target.textContent);
    });
  </script>
</body>
</html>
