<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef4ff">
<title>Attendance</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  :root{
    --blue-700:#1d4ed8;
    --blue-600:#2563eb;
    --blue-500:#3b82f6;
    --blue-300:#93c5fd;
    --orange-500:#f97316;
    --orange-400:#fb923c;
    --ink:#0f172a;
    --muted:#64748b;
    --glass:rgba(255,255,255,.58);
    --stroke:rgba(255,255,255,.85);
  }

  html, body{ height:100%; }

  body{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
                Inter, system-ui, Roboto, sans-serif;
    color:var(--ink);
    background:#eef4ff;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ---------- Background ---------- */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-3;
    background:
      radial-gradient(120% 80% at 0% 0%, #dbeafe 0%, transparent 55%),
      radial-gradient(110% 75% at 100% 5%, #e0f2fe 0%, transparent 52%),
      radial-gradient(95% 65% at 50% 115%, #cfe4ff 0%, transparent 62%),
      linear-gradient(168deg, #f9fcff 0%, #eef4ff 45%, #ffffff 100%);
  }

  .blob{
    position:fixed; z-index:-2; border-radius:50%;
    filter:blur(70px); pointer-events:none;
    opacity:.9;
  }
  .b1{ width:340px; height:340px; top:-130px; left:-110px;
       background:rgba(59,130,246,.38); }
  .b2{ width:300px; height:300px; bottom:60px; right:-110px;
       background:rgba(251,146,60,.30); }
  .b3{ width:260px; height:260px; top:38%; right:-90px;
       background:rgba(147,197,253,.55); }
  .b4{ width:220px; height:220px; bottom:-90px; left:20%;
       background:rgba(37,99,235,.22); }

  /* ---------- App shell ---------- */
  .app{
    position:relative;
    height:100vh;
    height:100dvh;
    max-width:860px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:18px 20px 12px;
    flex-shrink:0;
  }

  .brand{ display:flex; align-items:center; gap:13px; min-width:0; }

  .logo{
    position:relative;
    width:46px; height:46px;
    border-radius:16px;
    display:grid; place-items:center;
    color:#fff;
    background:linear-gradient(140deg, var(--blue-500) 0%, var(--blue-600) 55%, var(--blue-700) 100%);
    box-shadow:
      0 10px 22px rgba(37,99,235,.35),
      inset 0 1px 0 rgba(255,255,255,.45),
      inset 0 -1px 0 rgba(15,23,42,.12);
    flex-shrink:0;
  }
  .logo svg{ width:24px; height:24px; }

  .logo::after{
    content:"";
    position:absolute; right:-3px; bottom:-3px;
    width:13px; height:13px; border-radius:50%;
    background:linear-gradient(140deg, var(--orange-400), var(--orange-500));
    border:2.5px solid #f2f7ff;
    box-shadow:0 3px 8px rgba(249,115,22,.45);
  }

  .brand-text{ min-width:0; }

  .brand-text h1{
    font-size:19px;
    font-weight:700;
    letter-spacing:-.4px;
    line-height:1.15;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .brand-text p{
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    letter-spacing:.1px;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .avatar{
    position:relative;
    width:44px; height:44px;
    border-radius:16px;
    border:1px solid var(--stroke);
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:0 6px 18px rgba(37,99,235,.14), inset 0 1px 0 rgba(255,255,255,.9);
    display:grid; place-items:center;
    color:var(--blue-600);
    cursor:pointer;
    transition:transform .2s ease;
    flex-shrink:0;
  }
  .avatar:active{ transform:scale(.94); }
  .avatar svg{ width:21px; height:21px; }

  .avatar::after{
    content:"";
    position:absolute; top:9px; right:9px;
    width:8px; height:8px; border-radius:50%;
    background:linear-gradient(140deg, var(--orange-400), var(--orange-500));
    box-shadow:0 0 0 2.5px rgba(255,255,255,.95), 0 2px 6px rgba(249,115,22,.5);
  }

  /* ---------- Content ---------- */
  .content{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:6px 20px 140px;
  }
  .content::-webkit-scrollbar{ display:none; }

  .page{ display:none; }
  .page.active{
    display:block;
    animation:pageIn .38s cubic-bezier(.22,.9,.35,1) both;
  }

  @keyframes pageIn{
    from{ opacity:0; transform:translateY(14px) scale(.985); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));
    width:min(700px, calc(100% - 26px));
    display:flex;
    gap:4px;
    padding:8px;
    border-radius:26px;
    background:rgba(255,255,255,.62);
    backdrop-filter:blur(26px) saturate(190%);
    -webkit-backdrop-filter:blur(26px) saturate(190%);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:
      0 14px 44px rgba(37,99,235,.18),
      0 3px 10px rgba(15,23,42,.06),
      inset 0 1px 0 rgba(255,255,255,.95);
    z-index:50;
  }

  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    padding:9px 2px 8px;
    border:none;
    border-radius:20px;
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:.1px;
    cursor:pointer;
    transition:background .3s cubic-bezier(.4,0,.2,1),
               color .3s ease,
               box-shadow .3s ease,
               transform .18s ease;
    min-width:0;
  }

  .tab svg{
    width:22px; height:22px;
    stroke-width:1.9;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }

  .tab span{
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .tab:active{ transform:scale(.94); }

  .tab.active{
    color:#fff;
    background:linear-gradient(140deg, var(--blue-500) 0%, var(--blue-600) 60%, var(--blue-700) 100%);
    box-shadow:
      0 10px 22px rgba(37,99,235,.38),
      inset 0 1px 0 rgba(255,255,255,.4);
  }

  .tab.active svg{ transform:translateY(-1px) scale(1.06); }

  /* =========================================================
     STUDENT PAGE
     ========================================================= */
  .student-page{ display:flex; flex-direction:column; gap:14px; }

  /* --- toolbar --- */
  .toolbar{ display:flex; flex-direction:column; gap:12px; }

  .search-wrap{ position:relative; }
  .search-wrap > svg{
    position:absolute;
    left:15px; top:50%;
    transform:translateY(-50%);
    width:18px; height:18px;
    color:var(--muted);
    pointer-events:none;
  }
  .search-input{
    width:100%;
    font-family:inherit;
    font-size:16px;
    font-weight:500;
    color:var(--ink);
    padding:14px 16px 14px 44px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.95);
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    box-shadow:0 8px 22px rgba(37,99,235,.10), inset 0 1px 0 #fff;
    outline:none;
    transition:box-shadow .2s, border-color .2s, background .2s;
    -webkit-appearance:none;
    appearance:none;
  }
  .search-input::-webkit-search-cancel-button{ -webkit-appearance:none; }
  .search-input::placeholder{ color:#94a3b8; font-weight:500; }
  .search-input:focus{
    background:#fff;
    border-color:rgba(59,130,246,.55);
    box-shadow:0 0 0 4px rgba(59,130,246,.14), 0 8px 22px rgba(37,99,235,.12);
  }

  .toolbar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:0 4px;
  }

  .result-count{
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    white-space:nowrap;
  }

  .segmented{
    display:flex;
    gap:3px;
    padding:4px;
    border-radius:14px;
    background:rgba(255,255,255,.65);
    border:1px solid rgba(255,255,255,.95);
    box-shadow:0 4px 14px rgba(37,99,235,.08), inset 0 1px 0 #fff;
  }
  .seg-btn{
    display:flex;
    align-items:center;
    gap:5px;
    padding:7px 12px;
    border:none;
    border-radius:10px;
    background:transparent;
    font-family:inherit;
    font-size:11.5px;
    font-weight:700;
    color:var(--muted);
    cursor:pointer;
    transition:background .25s, color .25s, box-shadow .25s;
  }
  .seg-btn svg{ width:15px; height:15px; }
  .seg-btn.active{
    background:linear-gradient(140deg, var(--blue-500), var(--blue-600));
    color:#fff;
    box-shadow:0 6px 14px rgba(37,99,235,.3);
  }

  /* --- chips --- */
  .chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 10px;
    border-radius:999px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.1px;
    white-space:nowrap;
  }
  .chip-level{ background:rgba(249,115,22,.13); color:#c2410c; }
  .chip-day{ background:rgba(59,130,246,.12); color:var(--blue-700); }
  .chip-term{ background:rgba(37,99,235,.10); color:var(--blue-700); }

  /* --- list view --- */
  .student-list{ display:flex; flex-direction:column; gap:10px; }

  .student-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:20px;
    background:rgba(255,255,255,.62);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(255,255,255,.92);
    box-shadow:0 6px 18px rgba(37,99,235,.08), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .student-list.anim .student-item{ animation:itemIn .4s cubic-bezier(.22,.9,.35,1) both; }

  @keyframes itemIn{
    from{ opacity:0; transform:translateY(10px) scale(.98); }
    to  { opacity:1; transform:translateY(0) scale(1); }
  }

  .avatar-sm{
    width:44px; height:44px;
    border-radius:14px;
    display:grid; place-items:center;
    color:#fff;
    font-size:15px;
    font-weight:800;
    letter-spacing:.5px;
    background:linear-gradient(140deg, var(--blue-500), var(--blue-700));
    box-shadow:0 6px 14px rgba(37,99,235,.3), inset 0 1px 0 rgba(255,255,255,.4);
    flex-shrink:0;
  }

  .item-info{ flex:1; min-width:0; }
  .item-name{
    font-size:14px;
    font-weight:700;
    letter-spacing:-.15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .item-meta{
    font-size:11.5px;
    font-weight:500;
    color:var(--muted);
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .item-schedule{ flex-shrink:0; }

  .item-del{
    width:30px; height:30px;
    border-radius:10px;
    border:none;
    background:rgba(239,68,68,.10);
    color:#ef4444;
    display:grid; place-items:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .2s, transform .15s;
  }
  .item-del svg{ width:14px; height:14px; }
  .item-del:active{ transform:scale(.88); background:rgba(239,68,68,.2); }

  /* --- board view --- */
  .student-board{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:12px;
  }

  .board-card{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:15px 14px 14px;
    border-radius:22px;
    background:rgba(255,255,255,.62);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(255,255,255,.92);
    box-shadow:0 6px 18px rgba(37,99,235,.08), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .student-board.anim .board-card{ animation:itemIn .4s cubic-bezier(.22,.9,.35,1) both; }

  .board-card .avatar-sm{ width:46px; height:46px; border-radius:15px; font-size:15.5px; }
  .board-card .item-del{ position:absolute; top:11px; right:11px; width:26px; height:26px; }

  .board-name{
    font-size:13.5px;
    font-weight:700;
    letter-spacing:-.15px;
    line-height:1.3;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    overflow-wrap:anywhere;
    padding-right:18px;
  }

  .board-chips{ display:flex; flex-wrap:wrap; gap:5px; }

  .board-foot{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    margin-top:auto;
    padding-top:2px;
  }
  .board-foot svg{ width:13px; height:13px; flex-shrink:0; color:var(--blue-500); }
  .board-foot span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* --- empty state --- */
  .empty-state{
    display:none;
    text-align:center;
    padding:44px 22px;
    border-radius:24px;
    background:rgba(255,255,255,.5);
    border:1px dashed rgba(147,197,253,.75);
  }
  .empty-state.show{ display:block; animation:pageIn .35s ease both; }

  .empty-icon{
    width:58px; height:58px;
    margin:0 auto 14px;
    border-radius:20px;
    display:grid; place-items:center;
    background:linear-gradient(140deg, rgba(59,130,246,.14), rgba(147,197,253,.28));
    color:var(--blue-600);
  }
  .empty-icon svg{ width:27px; height:27px; }

  .empty-title{ font-size:15px; font-weight:700; }
  .empty-sub{ font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.5; }

  .is-hidden{ display:none !important; }

  /* =========================================================
     FLOATING ADD BUTTON
     ========================================================= */
  .fab{
    position:fixed;
    z-index:60;
    bottom:calc(96px + env(safe-area-inset-bottom));
    right:max(18px, calc((100vw - 860px) / 2 + 22px));
    width:58px; height:58px;
    border-radius:20px;
    border:none;
    display:grid; place-items:center;
    color:#fff;
    background:linear-gradient(140deg, var(--blue-500), var(--blue-600) 55%, var(--blue-700));
    box-shadow:
      0 14px 32px rgba(37,99,235,.42),
      inset 0 1px 0 rgba(255,255,255,.42);
    cursor:pointer;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1),
               opacity .22s ease,
               box-shadow .2s;
  }
  .fab svg{ width:26px; height:26px; }
  .fab:active{ transform:scale(.92); }
  .fab.off{
    opacity:0;
    transform:scale(.7) translateY(12px);
    pointer-events:none;
  }

  /* =========================================================
     MODAL (POPUP FORM)
     ========================================================= */
  .modal-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(15,23,42,.30);
    backdrop-filter:blur(10px) saturate(150%);
    -webkit-backdrop-filter:blur(10px) saturate(150%);
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .28s ease, visibility .28s ease;
  }
  .modal-overlay.open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }

  .modal-card{
    width:min(520px, 100%);
    max-height:min(88vh, 780px);
    overflow-y:auto;
    scrollbar-width:none;
    padding:20px;
    border-radius:28px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(30px) saturate(190%);
    -webkit-backdrop-filter:blur(30px) saturate(190%);
    border:1px solid rgba(255,255,255,.96);
    box-shadow:
      0 30px 80px rgba(15,23,42,.30),
      inset 0 1px 0 #fff;
    transform:translateY(20px) scale(.95);
    opacity:0;
    transition:transform .36s cubic-bezier(.22,.9,.35,1), opacity .3s ease;
  }
  .modal-card::-webkit-scrollbar{ display:none; }
  .modal-overlay.open .modal-card{ transform:translateY(0) scale(1); opacity:1; }

  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .card-head-left{ display:flex; align-items:center; gap:9px; min-width:0; }
  .dot-accent{
    width:9px; height:9px; border-radius:50%;
    background:linear-gradient(140deg, var(--orange-400), var(--orange-500));
    box-shadow:0 2px 6px rgba(249,115,22,.5);
    flex-shrink:0;
  }
  .modal-head h2{
    font-size:16px;
    font-weight:700;
    letter-spacing:-.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .modal-close{
    width:34px; height:34px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.95);
    background:rgba(255,255,255,.75);
    color:var(--muted);
    display:grid; place-items:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .2s, transform .15s;
  }
  .modal-close svg{ width:16px; height:16px; }
  .modal-close:active{ transform:scale(.9); background:rgba(226,232,240,.9); }

  /* --- form fields --- */
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field.span-2{ grid-column:span 2; }

  .field label{
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.2px;
    padding-left:5px;
  }

  .field input,
  .field select{
    width:100%;
    font-family:inherit;
    font-size:16px;
    font-weight:500;
    color:var(--ink);
    padding:12px 14px;
    border-radius:15px;
    border:1px solid rgba(147,197,253,.45);
    background:rgba(255,255,255,.78);
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
    -webkit-appearance:none;
    appearance:none;
  }
  .field input::placeholder{ color:#9aa9bd; font-weight:500; }

  .field input:focus,
  .field select:focus{
    border-color:rgba(59,130,246,.65);
    background:#fff;
    box-shadow:0 0 0 4px rgba(59,130,246,.15);
  }

  .field select{
    padding-right:36px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat:no-repeat;
    background-position:right 13px center;
  }

  .term-preview{
    display:flex;
    padding-left:3px;
    margin-top:2px;
  }
  .term-preview[hidden]{ display:none; }

  .btn-primary{
    width:100%;
    margin-top:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px;
    border:none;
    border-radius:16px;
    font-family:inherit;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.1px;
    color:#fff;
    background:linear-gradient(140deg, var(--blue-500) 0%, var(--blue-600) 55%, var(--blue-700) 100%);
    box-shadow:
      0 10px 24px rgba(37,99,235,.32),
      inset 0 1px 0 rgba(255,255,255,.35);
    cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .btn-primary svg{ width:17px; height:17px; }
  .btn-primary:active{
    transform:scale(.98);
    box-shadow:0 4px 12px rgba(37,99,235,.28);
  }

  /* ---------- responsive ---------- */
  @media (max-width:360px){
    .tab{ font-size:8.5px; }
    .tab svg{ width:20px; height:20px; }
    .brand-text h1{ font-size:17px; }
    .field-grid{ gap:10px; }
    .field input, .field select{ padding:11px 12px; font-size:16px; }
    .field select{ padding-right:32px; background-position:right 10px center; }
    .item-schedule{ display:none; }
    .seg-btn{ padding:7px 10px; font-size:11px; }
    .modal-overlay{ padding:12px; }
    .modal-card{ padding:16px; border-radius:24px; }
  }

  @media (max-width:420px){
    .fab{ bottom:calc(92px + env(safe-area-inset-bottom)); width:54px; height:54px; border-radius:18px; }
  }

  @media (min-width:700px){
    .topbar{ padding:26px 32px 16px; }
    .content{ padding:10px 32px 150px; }
    .brand-text h1{ font-size:22px; }
    .tab{ font-size:11px; padding:11px 4px 10px; }
    .tab svg{ width:24px; height:24px; }
    .tabbar{ padding:9px; border-radius:28px; }
    .logo{ width:52px; height:52px; border-radius:18px; }
    .field-grid{ grid-template-columns:repeat(4, 1fr); }
    .field.span-2{ grid-column:span 2; }
    .student-board{ grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); }
    .modal-card{ padding:26px; }
  }
</style>
</head>
<body>

  <!-- Background -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>

  <div class="app">

    <!-- ===== Top Bar ===== -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="4"/>
            <path d="M8 2v4M16 2v4M3 10h18"/>
            <path d="m9 15 2 2 4-4"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="pageTitle">Home</h1>
          <p id="pageSub">Selamat datang kembali</p>
        </div>
      </div>

      <button class="avatar" aria-label="Profil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </header>

    <!-- ===== Content ===== -->
    <main class="content">

      <section class="page active" id="page-home">
        <!-- isi konten Home nanti di sini -->
      </section>

      <!-- ================= STUDENT ================= -->
      <section class="page" id="page-student">
        <div class="student-page">

          <!-- ---------- Search + view toggle ---------- -->
          <div class="toolbar">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <path d="m20 20-3.5-3.5"/>
              </svg>
              <input id="searchInput" class="search-input" type="search"
                     placeholder="Cari nama, level, hari, jam, term…"
                     autocomplete="off" enterkeyhint="search">
            </div>

            <div class="toolbar-row">
              <span class="result-count" id="resultCount">0 siswa</span>

              <div class="segmented" role="group" aria-label="Tampilan">
                <button type="button" class="seg-btn active" data-view="list">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 6h13M8 12h13M8 18h13"/>
                    <path d="M3 6h.01M3 12h.01M3 18h.01"/>
                  </svg>
                  List
                </button>
                <button type="button" class="seg-btn" data-view="board">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1.6"/>
                    <rect x="14" y="3" width="7" height="7" rx="1.6"/>
                    <rect x="3" y="14" width="7" height="7" rx="1.6"/>
                    <rect x="14" y="14" width="7" height="7" rx="1.6"/>
                  </svg>
                  Board
                </button>
              </div>
            </div>
          </div>

          <!-- ---------- Display ---------- -->
          <div class="student-list" id="studentList"></div>
          <div class="student-board is-hidden" id="studentBoard"></div>

          <div class="empty-state" id="emptyState">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </div>
            <p class="empty-title" id="emptyTitle">Belum ada siswa</p>
            <p class="empty-sub" id="emptySub">Tambahkan siswa pertama lewat tombol + di kanan bawah.</p>
          </div>

        </div>
      </section>

      <section class="page" id="page-attendance">
        <!-- isi konten Attendance nanti di sini -->
      </section>

      <section class="page" id="page-teacher">
        <!-- isi konten Teacher nanti di sini -->
      </section>

      <section class="page" id="page-setting">
        <!-- isi konten Setting nanti di sini -->
      </section>

    </main>

    <!-- ===== Tab Bar ===== -->
    <nav class="tabbar">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5 12 3l9 7.5"/>
          <path d="M5 9.6V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.6"/>
        </svg>
        <span>Home</span>
      </button>

      <button class="tab" data-tab="student">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Student</span>
      </button>

      <button class="tab" data-tab="attendance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="2" width="8" height="4" rx="1.4"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <path d="m9 14 2 2 4-4"/>
        </svg>
        <span>Attendance</span>
      </button>

      <button class="tab" data-tab="teacher">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10 12 5 2 10l10 5 10-5Z"/>
          <path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/>
        </svg>
        <span>Teacher</span>
      </button>

      <button class="tab" data-tab="setting">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </svg>
        <span>Setting</span>
      </button>
    </nav>

  </div>

  <!-- ===== Floating Add Button ===== -->
  <button class="fab off" id="fabAdd" aria-label="Tambah siswa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <!-- ===== Modal: Input Data Siswa ===== -->
  <div class="modal-overlay" id="studentModal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div class="card-head-left">
          <span class="dot-accent"></span>
          <h2 id="modalTitle">Input Data Siswa</h2>
        </div>
        <button type="button" class="modal-close" id="modalClose" aria-label="Tutup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="studentForm" novalidate>
        <div class="field-grid">
          <div class="field span-2">
            <label for="f-nama">Nama</label>
            <input id="f-nama" name="nama" type="text" placeholder="Nama lengkap siswa"
                   autocomplete="off" required>
          </div>

          <div class="field">
            <label for="f-lahir">Tanggal Lahir</label>
            <input id="f-lahir" name="lahir" type="date">
          </div>

          <div class="field">
            <label for="f-umur">Umur</label>
            <input id="f-umur" name="umur" type="number" min="0" max="120"
                   inputmode="numeric" placeholder="0">
          </div>

          <div class="field">
            <label for="f-level">Level</label>
            <select id="f-level" name="level">
              <option value="">Pilih</option>
              <option>Level 1</option>
              <option>Level 2</option>
              <option>Level 3</option>
              <option>Level 4</option>
              <option>Level 5</option>
              <option>Level 6</option>
              <option>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
            </select>
          </div>

          <div class="field">
            <label for="f-hari">Hari</label>
            <select id="f-hari" name="hari">
              <option value="">Pilih</option>
              <option>Senin</option>
              <option>Selasa</option>
              <option>Rabu</option>
              <option>Kamis</option>
              <option>Jumat</option>
              <option>Sabtu</option>
              <option>Minggu</option>
            </select>
          </div>

          <div class="field">
            <label for="f-jam">Jam</label>
            <input id="f-jam" name="jam" type="text" placeholder="cth: 09:00"
                   autocomplete="off" inputmode="text">
          </div>

          <div class="field">
            <label for="f-term">Term (pilih tanggal)</label>
            <input id="f-term" name="termDate" type="date">
            <div class="term-preview" id="termPreview" hidden></div>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Tambah Siswa
        </button>
      </form>
    </div>
  </div>

<script>
/* =========================================================
   TAB NAVIGATION
   ========================================================= */
const TITLES = {
  home:       ["Home",       "Selamat datang kembali"],
  student:    ["Student",    "Kelola data siswa"],
  attendance: ["Attendance", "Catat kehadiran"],
  teacher:    ["Teacher",    "Kelola data guru"],
  setting:    ["Setting",    "Pengaturan aplikasi"]
};

const tabs    = document.querySelectorAll('.tab');
const pages   = document.querySelectorAll('.page');
const elTitle = document.getElementById('pageTitle');
const elSub   = document.getElementById('pageSub');
const fabAdd  = document.getElementById('fabAdd');

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const key = tab.dataset.tab;

    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    pages.forEach(p => {
      p.classList.toggle('active', p.id === 'page-' + key);
    });

    const [title, sub] = TITLES[key] || ["", ""];
    elTitle.textContent = title;
    elSub.textContent   = sub;

    /* tombol + hanya tampil di tab Student */
    fabAdd.classList.toggle('off', key !== 'student');

    document.querySelector('.content').scrollTop = 0;

    if (navigator.vibrate) navigator.vibrate(8);
  });
});

/* =========================================================
   STUDENT MODULE
   ========================================================= */
(function(){
  const LS_KEY = 'attendance.students.v1';

  /* Singkatan bulan Indonesia */
  const MONTHS_ID = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

  const form        = document.getElementById('studentForm');
  const modal       = document.getElementById('studentModal');
  const modalClose  = document.getElementById('modalClose');
  const listEl      = document.getElementById('studentList');
  const boardEl     = document.getElementById('studentBoard');
  const emptyEl     = document.getElementById('emptyState');
  const emptyTitle  = document.getElementById('emptyTitle');
  const emptySub    = document.getElementById('emptySub');
  const searchEl    = document.getElementById('searchInput');
  const countEl     = document.getElementById('resultCount');
  const lahirEl     = document.getElementById('f-lahir');
  const umurEl      = document.getElementById('f-umur');
  const termEl      = document.getElementById('f-term');
  const termPreview = document.getElementById('termPreview');
  const segBtns     = document.querySelectorAll('.seg-btn');

  let students    = [];
  let viewMode    = 'list';
  let query       = '';
  let animateNext = true;

  /* ---------- storage ---------- */
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) students = parsed;
    }
  }catch(e){ students = []; }

  function persist(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(students)); }catch(e){}
  }

  /* ---------- helpers ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));

  function initials(name){
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  /* Term: dari tanggal -> 3 bulan (contoh 1 Januari => "Jan-Mar") */
  function termLabelFromDate(v){
    if(!v) return '';
    const d = new Date(v + 'T00:00:00');
    if(isNaN(d.getTime())) return '';
    const start = d.getMonth();
    const end   = (start + 2) % 12;
    return MONTHS_ID[start] + '-' + MONTHS_ID[end];
  }

  function calcAge(v){
    if(!v) return '';
    const b = new Date(v + 'T00:00:00');
    if(isNaN(b.getTime())) return '';
    const n = new Date();
    let a = n.getFullYear() - b.getFullYear();
    const m = n.getMonth() - b.getMonth();
    if(m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
    if(a < 0 || a > 150) return '';
    return a;
  }

  /* ---------- auto umur dari tanggal lahir ---------- */
  function syncAge(){
    const a = calcAge(lahirEl.value);
    if(a !== '') umurEl.value = a;
  }
  lahirEl.addEventListener('change', syncAge);
  lahirEl.addEventListener('blur', syncAge);

  /* ---------- preview term ---------- */
  function updateTermPreview(){
    const label = termLabelFromDate(termEl.value);
    if(label){
      termPreview.innerHTML = '<span class="chip chip-term">' + esc(label) + '</span>';
      termPreview.hidden = false;
    }else{
      termPreview.hidden = true;
      termPreview.textContent = '';
    }
  }
  termEl.addEventListener('change', updateTermPreview);
  termEl.addEventListener('input', updateTermPreview);

  /* ---------- modal open / close ---------- */
  function openModal(){
    form.reset();
    updateTermPreview();
    modal.classList.add('open');
    setTimeout(() => {
      const nama = document.getElementById('f-nama');
      if(nama) nama.focus();
    }, 340);
  }

  function closeModal(){
    modal.classList.remove('open');
  }

  fabAdd.addEventListener('click', openModal);
  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && modal.classList.contains('open')) closeModal();
  });

  /* ---------- submit ---------- */
  form.addEventListener('submit', e => {
    e.preventDefault();

    const data = new FormData(form);
    const nama = String(data.get('nama') || '').trim();

    if(!nama){
      const el = document.getElementById('f-nama');
      if(el) el.focus();
      return;
    }

    const termDate = String(data.get('termDate') || '');
    const term     = termLabelFromDate(termDate);

    students.unshift({
      id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      nama,
      lahir:    String(data.get('lahir') || ''),
      umur:     String(data.get('umur')  || ''),
      level:    String(data.get('level') || ''),
      hari:     String(data.get('hari')  || ''),
      jam:      String(data.get('jam')   || ''),
      term:     term,
      termDate: termDate,
      createdAt: Date.now()
    });

    persist();
    form.reset();
    updateTermPreview();
    closeModal();

    animateNext = true;
    render();

    if(navigator.vibrate) navigator.vibrate(12);
  });

  /* ---------- filter ---------- */
  function matches(s, q){
    if(!q) return true;
    const hay = [s.nama, s.level, s.hari, s.jam, s.term, s.termDate, s.umur, s.lahir]
                  .join(' ').toLowerCase();
    return hay.includes(q);
  }

  /* ---------- templates ---------- */
  function listItemHTML(s){
    const meta = [s.level, s.term].filter(Boolean).join(' • ')
               + (s.umur ? (s.level || s.term ? ' • ' : '') + s.umur + ' th' : '');
    const sched = [s.hari, s.jam].filter(Boolean).join(' • ');

    return `
      <div class="student-item">
        <div class="avatar-sm">${esc(initials(s.nama))}</div>
        <div class="item-info">
          <div class="item-name">${esc(s.nama)}</div>
          <div class="item-meta">${esc(meta || 'Belum ada data')}</div>
        </div>
        ${sched ? `<div class="item-schedule"><span class="chip chip-day">${esc(sched)}</span></div>` : ''}
        <button type="button" class="item-del" data-del="${esc(s.id)}" aria-label="Hapus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>`;
  }

  function boardCardHTML(s){
    const sched = [s.hari, s.jam].filter(Boolean).join(' • ');

    return `
      <div class="board-card">
        <button type="button" class="item-del" data-del="${esc(s.id)}" aria-label="Hapus">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
        <div class="avatar-sm">${esc(initials(s.nama))}</div>
        <div class="board-name">${esc(s.nama)}</div>
        <div class="board-chips">
          ${s.level ? `<span class="chip chip-level">${esc(s.level)}</span>` : ''}
          ${s.term  ? `<span class="chip chip-term">${esc(s.term)}</span>`  : ''}
          ${s.umur  ? `<span class="chip chip-term">${esc(s.umur)} th</span>` : ''}
        </div>
        <div class="board-foot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
          </svg>
          <span>${esc(sched || 'Belum ada jadwal')}</span>
        </div>
      </div>`;
  }

  /* ---------- render ---------- */
  function render(){
    const q        = query.trim().toLowerCase();
    const filtered = students.filter(s => matches(s, q));
    const isEmpty  = filtered.length === 0;

    countEl.textContent = q
      ? `${filtered.length} dari ${students.length} siswa`
      : `${students.length} siswa`;

    listEl.innerHTML  = filtered.map(listItemHTML).join('');
    boardEl.innerHTML = filtered.map(boardCardHTML).join('');

    listEl.classList.toggle('anim',  animateNext);
    boardEl.classList.toggle('anim', animateNext);
    animateNext = false;

    listEl.classList.toggle('is-hidden',  isEmpty || viewMode !== 'list');
    boardEl.classList.toggle('is-hidden', isEmpty || viewMode !== 'board');

    emptyEl.classList.toggle('show', isEmpty);
    emptyTitle.textContent = q ? 'Tidak ditemukan' : 'Belum ada siswa';
    emptySub.textContent   = q
      ? 'Coba kata kunci lain untuk mencari siswa.'
      : 'Tambahkan siswa pertama lewat tombol + di kanan bawah.';
  }

  /* ---------- delete ---------- */
  function handleDelete(e){
    const btn = e.target.closest('[data-del]');
    if(!btn) return;

    const id = btn.getAttribute('data-del');
    const s  = students.find(x => x.id === id);
    if(!s) return;

    if(!window.confirm(`Hapus data "${s.nama}"?`)) return;

    students = students.filter(x => x.id !== id);
    persist();
    animateNext = false;
    render();
  }
  listEl.addEventListener('click', handleDelete);
  boardEl.addEventListener('click', handleDelete);

  /* ---------- search ---------- */
  searchEl.addEventListener('input', () => {
    query = searchEl.value;
    animateNext = false;
    render();
  });

  /* ---------- view toggle ---------- */
  segBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.classList.contains('active')) return;

      segBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      viewMode = btn.dataset.view;
      animateNext = false;
      render();

      if(navigator.vibrate) navigator.vibrate(6);
    });
  });

  /* ---------- init ---------- */
  render();
})();
</script>
</body>
</html>
